<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}

main{padding:16px}.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:13px;box-shadow:0 4px 18px #1720330c}.section{font-size:19px;font-weight:800;margin:20px 2px 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f8fb;border-radius:16px;padding:14px}.metric span{color:#747f91;font-size:13px}.metric b{display:block;font-size:23px;margin-top:4px}.btn{background:#2458e8;color:#fff;border:0;border-radius:13px;padding:11px 14px;font-weight:750}.btn.gray{background:#edf0f5;color:#283246}.btn.red{background:#df3c4c}.btn.green{background:#14924c}.input,.select{width:100%;border:1px solid #dce1e9;border-radius:13px;padding:12px;background:#fff;margin:5px 0 9px}label{display:block;font-size:12px;font-weight:700;color:#687386;margin-top:4px}.person,.task{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #edf0f3}.person:last-child,.task:last-child{border:0}.avatar{width:43px;height:43px;border-radius:14px;background:#e9edff;color:#3152bf;display:grid;place-items:center;font-weight:800}.pill{font-size:12px;font-weight:750;padding:6px 9px;border-radius:10px;background:#eaf8ef;color:#197447;white-space:nowrap}.pill.gray{background:#eef1f5;color:#687386}.pill.red{background:#fff0f1;color:#c42e3f}.pill.yellow{background:#fff7dc;color:#8c6500}.small{font-size:12px;color:#788294}.kpirow{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr;gap:6px;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f3;font-size:13px}.kpirow b{font-size:14px}.up{color:#15904a;font-weight:750}.down{color:#d73c4b;font-weight:750}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;height:78px;background:#fff;border-top:1px solid #e4e8ef;display:flex;justify-content:space-around;padding-top:8px;z-index:10}.nav button{border:0;background:none;color:#7b8492;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button.active{color:#2458e8;font-weight:800}.ico{font-size:21px}.empty{text-align:center;padding:22px;color:#778194}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}.modal.open{display:flex}.actions{display:flex;gap:8px}.actions>*{flex:1}.notice{background:#eef5ff;border:1px solid #d6e5ff;border-radius:15px;padding:12px;color:#254a9d}.danger{background:#fff1f2;border:1px solid #ffd8dc}.ok{background:#edf9f2;border:1px solid #d1f0dd}.kpi-card{background:#f7f8fb;border-radius:16px;padding:14px;margin-top:10px}.kpi-big{font-size:26px;font-weight:850}.pending{color:#9a6a00;font-weight:800}.missing{color:#c42e3f;font-weight:800}.done{color:#197447;font-weight:800}

<body>
<div class="app">
<header class="head"><div class="eyebrow">STORE MANAGER</div><div class="title">Gestione Personale</div><div class="sub">Planning · Attività · KPI · Richieste</div></header>
<main id="main"></main><nav id="nav" class="nav"></nav>
</div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const SUPABASE_URL="https://mgklvroxfowgqljehquz.supabase.co";
const SUPABASE_KEY="sb_publishable_Jro2VCtNW_GFYE6w0hfUYw_SBNsvb8M";
const KEY="store_manager_v5";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{tab:"home",people:[],requests:[],tasks:[],shifts:[],kpi:{selected:"2026-09",storeByPeriod:{},peopleByPeriod:{},daily:{}},online:true};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10);
function periodLabel(p){const[y,m]=p.split("-").map(Number);return new Intl.DateTimeFormat("it-IT",{month:"long",year:"numeric"}).format(new Date(y,m-1,1)).replace(/^./,c=>c.toUpperCase())}
function previousPeriod(p){const[y,m]=p.split("-").map(Number);return `${y-1}-${String(m).padStart(2,"0")}`}
function monthOptions(){return ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"].map((n,i)=>`<option value="${String(i+1).padStart(2,"0")}">${n}</option>`).join("")}
function yearOptions(selected){let y=+selected.slice(0,4),s="";for(let i=2020;i<=2035;i++)s+=`<option value="${i}" ${i===y?"selected":""}>${i}</option>`;return s}
function ensureKpi(p){if(!S.kpi.storeByPeriod[p])S.kpi.storeByPeriod[p]={sales:0,receipts:0,avg:0,upt:0,conv:0};S.people.forEach(x=>{if(!S.kpi.peopleByPeriod[x.id])S.kpi.peopleByPeriod[x.id]={}})}
function dateLocal(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function kpiPeriodFromDate(d){return d.slice(0,7)}
function weekNumber(d){let x=new Date(d+"T12:00:00"),day=x.getDay()||7;x.setDate(x.getDate()+4-day);let y=new Date(x.getFullYear(),0,1);return Math.ceil((((x-y)/86400000)+1)/7)}
function sameWeekLastYear(d){let x=new Date(d+"T12:00:00");x.setFullYear(x.getFullYear()-1);return dateLocal(x)}
function kpiRowsForPerson(pid,period){let rows=Object.values(S.kpi.daily||{}).filter(r=>String(r.personId)===String(pid)&&r.date.startsWith(period));return rows.sort((a,b)=>a.date.localeCompare(b.date))}
function calcKpi(rows){let sales=rows.reduce((a,r)=>a+(+r.sales||0),0),receipts=rows.reduce((a,r)=>a+(+r.receipts||0),0),pieces=rows.reduce((a,r)=>a+(+r.pieces||0),0);return {sales,receipts,pieces,atv:receipts?sales/receipts:0,upt:receipts?pieces/receipts:0}}
function todayKpiRows(){return S.kpi.daily||{}}
function kpiCutoffMissing(){let now=new Date(),d=dateLocal(now),h=now.getHours();return h>=22 && S.people.filter(p=>p.active).filter(p=>!Object.values(todayKpiRows()).some(r=>String(r.personId)===String(p.id)&&r.date===d)).map(p=>p)}
function openModal(title,body){document.getElementById("sheet").innerHTML=`<div class="row"><h2 style="margin:0 0 15px">${title}</h2><button class="btn gray" onclick="closeModal()">Chiudi</button></div>${body}`;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function nav(){let a=[["home","⌂","Home"],["planning","▦","Planning"],["people","♙","Personale"],["tasks","✓","Attività"],["requests","✉","Richieste"],["kpi","▥","KPI"]];document.getElementById("nav").innerHTML=a.map(x=>`<button class="${S.tab==x[0]?"active":""}" onclick="S.tab='${x[0]}';save();render()"><span class="ico">${x[1]}</span>${x[2]}</button>`).join("")}
async function sb(path,opt={}){const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:opt.prefer||"return=representation"},...opt});if(!r.ok){let t=await r.text();throw new Error(t||r.status)}return r.status===204?null:r.json()}
async function loadRequests(){try{let rows=await sb("Richieste?select=*&order=created_at.desc");S.requests=rows.map(r=>({id:r.id,personId:r.dipendente_id,type:r.tipo,start:r.data_richiesta,end:r.data_richiesta_fine,note:r.note,status:r.stato,created:r.created_at}));S.online=true;save();render()}catch(e){S.online=false;save();render()}}
async function loadKpis(){try{let rows=await sb('KpiGiornalieri?select=*&order=data.asc');S.kpi.daily={};rows.forEach(r=>{let key=String(r.dipendente_id)+'_'+r.data;S.kpi.daily[key]={id:r.id,personId:r.dipendente_id,date:r.data,sales:Number(r.fatturato)||0,receipts:Number(r.scontrini)||0,pieces:Number(r.pezzi_venduti)||0,updatedAt:r.created_at||null}});S.online=true;save();render()}catch(e){console.warn('KPI online non caricati',e);S.online=false;save();render()}}
async function saveDailyKpi(){let pid=+document.getElementById('kePerson').value,date=document.getElementById('keDate').value;if(!pid||!date)return alert('Seleziona risorsa e data.');let sales=+document.getElementById('keSales').value||0,receipts=+document.getElementById('keReceipts').value||0,pieces=+document.getElementById('kePieces').value||0;let payload={dipendente_id:pid,data:date,fatturato:sales,scontrini:receipts,pezzi_venduti:pieces};try{let rows=await sb('KpiGiornalieri?on_conflict=dipendente_id,data',{method:'POST',prefer:'resolution=merge-duplicates,return=representation',body:JSON.stringify(payload)});let r=Array.isArray(rows)?rows[0]:rows;let key=pid+'_'+date;S.kpi.daily[key]={id:r?.id||key,personId:pid,date,sales,receipts,pieces,updatedAt:new Date().toISOString()};save();closeModal();await loadKpis()}catch(e){alert('Supabase non ha accettato il KPI.\n\n'+(e.message||e))}}
async function createRequest(id){let p=S.people.find(x=>x.id===id);if(!p){alert("Seleziona una risorsa.");return}let start=document.getElementById("rqStart").value,end=document.getElementById("rqEnd").value,note=document.getElementById("rqNote").value.trim();if(!start){alert("Inserisci la data.");return}if(!end)end=start;try{await sb("Richieste",{method:"POST",body:JSON.stringify({dipendente_id:p.id,tipo:"Giorno libero",data_richiesta:start,data_richiesta_fine:end,note,stato:"In attesa"})});closeModal();await loadRequests();alert("Richiesta inviata.")}catch(e){alert("Supabase non ha accettato la richiesta.\n\n"+(e.message||e))}}
async function updateRequest(id,status){try{await sb("Richieste?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({stato:status})});await loadRequests()}catch(e){alert("Impossibile aggiornare la richiesta.\n\n"+(e.message||e))}}
function requestForm(){let a=S.people.filter(p=>p.active);openModal("Nuova richiesta giorno libero",`<label>Risorsa</label><select id="rqPerson" class="select">${a.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><label>Dal</label><input id="rqStart" class="input" type="date" value="${today()}"><label>Al</label><input id="rqEnd" class="input" type="date" value="${today()}"><label>Nota / motivazione</label><textarea id="rqNote" class="input" rows="3" placeholder="Facoltativa"></textarea><button class="btn" style="width:100%" onclick="createRequest(+document.getElementById('rqPerson').value)">Invia richiesta</button>`)}
function home(){let pending=S.requests.filter(r=>r.status==="In attesa").length;return `<section class="card"><div class="small">OGGI</div><h2 style="margin:6px 0 16px">Panoramica negozio</h2><div class="grid"><div class="metric"><span>Risorse attive</span><b>${S.people.filter(p=>p.active).length}</b></div><div class="metric"><span>Turni inseriti</span><b>${S.shifts.length}</b></div><div class="metric"><span>Attività</span><b>${S.tasks.length}</b></div><div class="metric"><span>Richieste</span><b>${pending}</b></div></div></section><div class="section">Accessi rapidi</div><section class="card"><div class="actions"><button class="btn" onclick="S.tab='people';render()">+ Risorsa</button><button class="btn gray" onclick="S.tab='planning';render()">+ Turno</button><button class="btn gray" onclick="S.tab='requests';loadRequests()">Richieste ${pending?`(${pending})`:""}</button></div></section><section class="card"><div class="${S.online?"ok":"danger"}"><b>${S.online?"☁️ Collegamento online attivo":"⚠️ Collegamento online non disponibile"}</b><div class="small" style="margin-top:5px">${S.online?"Le richieste vengono salvate in Supabase.":"Le richieste online non sono raggiungibili in questo momento."}</div></div></section>`}
function people(){return `<div class="row"><div class="section">Personale</div><button class="btn" onclick="editPerson()">+ Aggiungi</button></div><section class="card">${S.people.length?S.people.map(p=>`<div class="person"><div class="avatar">${esc((p.name||"?")[0])}</div><div style="flex:1"><b>${esc(p.name)}</b><div class="small">${esc(p.role||"Risorsa")} · ingresso ${esc(p.in||"—")}${p.out?" · uscita "+esc(p.out):""}</div></div><span class="pill ${p.active?"":"gray"}">${p.active?"Attiva":"Archiviata"}</span><button class="btn gray" onclick="editPerson(${p.id})">Modifica</button></div>`).join(""):`<div class="empty">Nessuna risorsa inserita.</div>`}</section>`}
function editPerson(id){let p=S.people.find(x=>x.id===id)||{id:Date.now(),name:"",role:"",in:"",out:"",active:true};openModal(id?"Modifica risorsa":"Nuova risorsa",`<label>Nome e cognome</label><input id="pn" class="input" value="${esc(p.name)}"><label>Ruolo</label><input id="pr" class="input" value="${esc(p.role)}"><label>Data ingresso</label><input id="pi" class="input" value="${esc(p.in)}" placeholder="gg/mm/aaaa"><label>Data uscita</label><input id="po" class="input" value="${esc(p.out)}"><div class="row" style="margin:8px 0 16px"><span>Risorsa attiva</span><input id="pa" type="checkbox" ${p.active?"checked":""}></div><button class="btn" style="width:100%" onclick="savePerson(${p.id})">Salva risorsa</button>`)}
function savePerson(id){let p=S.people.find(x=>x.id===id);if(!p){p={id,name:"",role:"",in:"",out:"",active:true};S.people.push(p)}p.name=document.getElementById("pn").value.trim();p.role=document.getElementById("pr").value.trim();p.in=document.getElementById("pi").value.trim();p.out=document.getElementById("po").value.trim();p.active=document.getElementById("pa").checked;if(!p.name)return alert("Inserisci il nome.");save();closeModal();render()}
function planning(){return `<div class="row"><div class="section">Planning</div><button class="btn" onclick="editShift()">+ Turno</button></div><section class="card">${S.shifts.length?S.shifts.map(x=>`<div class="task"><div style="flex:1"><b>${esc(x.person)}</b><div class="small">${esc(x.date)} · ${esc(x.start)}–${esc(x.end)} · pausa ${esc(x.breakStart)}–${esc(x.breakEnd)}</div></div><button class="btn gray" onclick="editShift(${x.id})">Modifica</button></div>`).join(""):`<div class="empty">Nessun turno inserito.</div>`}</section><section class="card"><b>🤖 Organizza pause</b><p class="small">Proposta automatica basata sui turni inseriti.</p><button class="btn" onclick="alert('Proposta automatica disponibile nel modulo planning.')">Proponi pause</button></section>`}
function editShift(id){let x=S.shifts.find(a=>a.id===id)||{id:Date.now(),person:"",date:today(),start:"09:00",end:"17:00",breakStart:"13:00",breakEnd:"13:30"};openModal(id?"Modifica turno":"Nuovo turno",`<label>Risorsa</label><select id="sp" class="select">${S.people.filter(p=>p.active).map(p=>`<option ${p.name==x.person?"selected":""}>${esc(p.name)}</option>`).join("")}</select><label>Giorno</label><input id="sd" class="input" type="date" value="${x.date}"><div class="grid"><div><label>Entrata</label><input id="ss" class="input" type="time" value="${x.start}"></div><div><label>Uscita</label><input id="se" class="input" type="time" value="${x.end}"></div></div><div class="grid"><div><label>Inizio pausa</label><input id="bs" class="input" type="time" value="${x.breakStart}"></div><div><label>Fine pausa</label><input id="be" class="input" type="time" value="${x.breakEnd}"></div></div><button class="btn" style="width:100%" onclick="saveShift(${x.id})">Salva turno</button>`)}
function saveShift(id){let x=S.shifts.find(a=>a.id===id);if(!x){x={id};S.shifts.push(x)}x.person=document.getElementById("sp").value;x.date=document.getElementById("sd").value;x.start=document.getElementById("ss").value;x.end=document.getElementById("se").value;x.breakStart=document.getElementById("bs").value;x.breakEnd=document.getElementById("be").value;save();closeModal();render()}
function tasks(){return `<div class="row"><div class="section">Attività</div><button class="btn" onclick="addTask()">+ Attività</button></div><section class="card">${S.tasks.length?S.tasks.map(t=>`<div class="task"><div style="flex:1"><b>${esc(t.name)}</b><div class="small">${esc(t.person||"Da assegnare")} · ${esc(t.date||"oggi")}</div></div><button class="btn gray" onclick="toggleTask(${t.id})">${t.done?"Riapri":"Fatto"}</button><button class="btn gray" onclick="editTask(${t.id})">Modifica</button><button class="btn gray" onclick="deleteTask(${t.id})">Elimina</button><span class="pill">${t.done?"Fatto":"Assegnata"}</span></div>`).join(""):`<div class="empty">Nessuna attività.</div>`}</section><section class="card"><b>Assegnazione automatica</b><p class="small">Distribuisce le attività tra le risorse attive.</p><button class="btn" onclick="autoTasks()">Genera assegnazioni</button></section>`}
function addTask(){let a=S.people.filter(p=>p.active);if(!a.length)return alert("Prima inserisci una risorsa.");openModal("Nuova attività",`<label>Attività</label><input id="taskName" class="input"><label>Assegna a</label><select id="taskPerson" class="select"><option value="">Da assegnare</option>${a.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><label>Data</label><input id="taskDate" class="input" type="date" value="${today()}"><button class="btn" style="width:100%" onclick="saveNewTask()">Salva attività</button>`)}
function saveNewTask(){let n=document.getElementById("taskName").value.trim();if(!n)return alert("Inserisci il nome.");S.tasks.push({id:Date.now(),name:n,person:document.getElementById("taskPerson").value,date:document.getElementById("taskDate").value,done:false});save();closeModal();render()}
function editTask(id){let t=S.tasks.find(x=>x.id===id),a=S.people.filter(p=>p.active);if(!t)return;openModal("Modifica attività",`<label>Attività</label><input id="taskName" class="input" value="${esc(t.name)}"><label>Assegna a</label><select id="taskPerson" class="select"><option value="">Da assegnare</option>${a.map(p=>`<option ${p.name===t.person?"selected":""}>${esc(p.name)}</option>`).join("")}</select><label>Data</label><input id="taskDate" class="input" type="date" value="${t.date||today()}"><button class="btn" style="width:100%" onclick="saveTaskEdit(${id})">Salva modifiche</button>`)}
function saveTaskEdit(id){let t=S.tasks.find(x=>x.id===id);if(!t)return;t.name=document.getElementById("taskName").value.trim();t.person=document.getElementById("taskPerson").value;t.date=document.getElementById("taskDate").value;save();closeModal();render()}
function toggleTask(id){let t=S.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}}
function deleteTask(id){let t=S.tasks.find(x=>x.id===id);if(t&&confirm(`Eliminare "${t.name}"?`)){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}}
function autoTasks(){let a=S.people.filter(p=>p.active).map(p=>p.name);if(!a.length)return;S.tasks.forEach((t,i)=>t.person=a[i%a.length]);save();render()}
function requests(){let p=S.requests.filter(r=>r.status==="In attesa").length;return `<div class="row"><div class="section">Richieste giorni liberi</div><button class="btn" onclick="requestForm()">+ Richiesta</button></div><section class="card"><div class="notice"><b>${p} ${p===1?"richiesta":"richieste"} in sospeso</b><div class="small">Le richieste vengono salvate online in Supabase.</div></div></section><section class="card">${S.requests.length?S.requests.map(r=>{let person=S.people.find(p=>p.id==r.personId);return `<div style="padding:13px 0;border-bottom:1px solid #edf0f3"><div class="row"><div><b>${esc(person?.name||"Risorsa")}</b><div class="small">${r.start}${r.end&&r.end!==r.start?" → "+r.end:""} · ${esc(r.type||"Giorno libero")}</div></div><span class="pill ${r.status==="Approvata"?"":"red"}">${esc(r.status)}</span></div>${r.note?`<div class="small" style="margin:8px 0">Motivazione: ${esc(r.note)}</div>`:""}${r.status==="In attesa"?`<div class="actions" style="margin-top:8px"><button class="btn green" onclick="updateRequest(${r.id},'Approvata')">Approva</button><button class="btn red" onclick="updateRequest(${r.id},'Rifiutata')">Rifiuta</button></div>`:""}</div>`}).join(""):`<div class="empty">Nessuna richiesta.</div>`}</section>`}
function kpi(){
 let period=S.kpi.selected||dateLocal().slice(0,7), active=S.people.filter(p=>p.active), today=dateLocal(), missing=kpiCutoffMissing();
 let todayRows=active.map(p=>({p,row:Object.values(todayKpiRows()).find(r=>String(r.personId)===String(p.id)&&r.date===today)}));
 let store=calcKpi(Object.values(todayKpiRows()).filter(r=>r.date.startsWith(period)));
 let weekStart=new Date(period+"-01T12:00:00"), selectedDate=today.startsWith(period)?today:period+"-01", wn=weekNumber(selectedDate), year=+period.slice(0,4), weekRows=Object.values(todayKpiRows()).filter(r=>weekNumber(r.date)===wn&&+r.date.slice(0,4)===year), lastYearRows=Object.values(todayKpiRows()).filter(r=>weekNumber(r.date)===wn&&+r.date.slice(0,4)===year-1), wk=calcKpi(weekRows), ly=calcKpi(lastYearRows), pct=(a,b)=>b?((a-b)/b*100):null;
 return `<div class="row"><div class="section">KPI</div><button class="btn" onclick="kpiEntry()">+ Inserisci dati</button></div><section class="card notice"><b>☁️ KPI condivisi online</b><div class="small">I dati giornalieri vengono salvati in Supabase e sono visibili anche dagli altri dispositivi.</div></section>
 <section class="card"><div class="grid"><div><label>Mese</label><select id="kpiMonth" class="select" onchange="changeKpiPeriod()">${monthOptions()}</select></div><div><label>Anno</label><select id="kpiYear" class="select" onchange="changeKpiPeriod()">${yearOptions(period)}</select></div></div></section>
 ${missing.length?`<section class="card danger"><b>⚠️ KPI non inseriti entro le 22:00</b><div class="small" style="margin-top:6px">${missing.map(p=>esc(p.name)).join(" · ")}</div></section>`:""}
 <section class="card"><b>🏪 KPI negozio · settimana ${wn}</b><div class="small" style="margin:5px 0 12px">Settimana ${wn} ${year} vs settimana ${wn} ${year-1}</div><div class="grid"><div class="kpi-card"><span>Fatturato</span><div class="kpi-big">${fmt(wk.sales)}</div><div class="small">${fmt(ly.sales)} anno prec. ${pct(wk.sales,ly.sales)==null?"":`· ${pct(wk.sales,ly.sales)>=0?"+":""}${pct(wk.sales,ly.sales).toFixed(1)}%`}</div></div><div class="kpi-card"><span>ATV</span><div class="kpi-big">${fmt(wk.atv)}</div><div class="small">${fmt(ly.atv)} anno prec. ${pct(wk.atv,ly.atv)==null?"":`· ${pct(wk.atv,ly.atv)>=0?"+":""}${pct(wk.atv,ly.atv).toFixed(1)}%`}</div></div><div class="kpi-card"><span>UPT</span><div class="kpi-big">${wk.upt.toFixed(2)}</div><div class="small">${ly.upt.toFixed(2)} anno prec. ${pct(wk.upt,ly.upt)==null?"":`· ${pct(wk.upt,ly.upt)>=0?"+":""}${pct(wk.upt,ly.upt).toFixed(1)}%`}</div></div></div></section>
 <section class="card"><b>👤 KPI personali · ${periodLabel(period)}</b><div class="small" style="margin:5px 0 12px">Fatturato · ATV · UPT, calcolati dai dati giornalieri inseriti.</div>${active.map(p=>{let c=calcKpi(kpiRowsForPerson(p.id,period));return `<div class="kpi-card"><div class="row"><b>${esc(p.name)}</b><span class="pill ${kpiRowsForPerson(p.id,period).length?'':'gray'}">${kpiRowsForPerson(p.id,period).length?`${kpiRowsForPerson(p.id,period).length} giorni`:'Nessun dato'}</span></div><div class="grid" style="margin-top:8px"><div><span class="small">Fatturato</span><div><b>${fmt(c.sales)}</b></div></div><div><span class="small">ATV</span><div><b>${fmt(c.atv)}</b></div></div><div><span class="small">UPT</span><div><b>${c.upt.toFixed(2)}</b></div></div></div></div>`}).join("")||`<div class="empty">Nessuna risorsa attiva.</div>`}</section>`
}
function kpiEntry(){let a=S.people.filter(p=>p.active),d=dateLocal(),existing={};a.forEach(p=>existing[p.id]=Object.values(todayKpiRows()).find(r=>String(r.personId)===String(p.id)&&r.date===d)||{});openModal("Inserimento KPI giornalieri",`<div class="notice">Inserisci i dati della giornata. I KPI vengono calcolati automaticamente.</div><label>Risorsa</label><select id="kePerson" class="select">${a.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><label>Data</label><input id="keDate" class="input" type="date" value="${d}"><label>Fatturato</label><input id="keSales" class="input" type="number" step="0.01" placeholder="0,00"><label>Scontrini</label><input id="keReceipts" class="input" type="number" min="0" step="1" placeholder="0"><label>Pezzi venduti</label><input id="kePieces" class="input" type="number" min="0" step="1" placeholder="0"><button class="btn" style="width:100%" onclick="saveDailyKpi()">Salva KPI</button>`)}

function changeKpiPeriod(){S.kpi.selected=document.getElementById("kpiYear").value+"-"+document.getElementById("kpiMonth").value;save();render()}
function render(){let t=S.tab;document.getElementById("main").innerHTML=t==="home"?home():t==="planning"?planning():t==="people"?people():t==="tasks"?tasks():t==="requests"?requests():kpi();nav();if(t==="kpi"){let[y,m]=(S.kpi.selected||"2026-09").split("-");document.getElementById("kpiMonth").value=m;document.getElementById("kpiYear").value=y}}
render();loadRequests();loadKpis();
</script>
</body></html>

<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}.head{background:#101827;color:white;padding:20px 18px 18px;border-radius:0 0 26px 26px}.eyebrow{font-size:12px;opacity:.65;font-weight:700;letter-spacing:.08em}.title{font-size:28px;font-weight:850;margin-top:3px}.sub{opacity:.72;font-size:14px;margin-top:4px}
main{padding:16px}.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:13px;box-shadow:0 4px 18px #1720330c}.section{font-size:19px;font-weight:800;margin:20px 2px 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f8fb;border-radius:16px;padding:14px}.metric span{color:#747f91;font-size:13px}.metric b{display:block;font-size:23px;margin-top:4px}.btn{background:#2458e8;color:#fff;border:0;border-radius:13px;padding:11px 14px;font-weight:750}.btn.gray{background:#edf0f5;color:#283246}.btn.red{background:#df3c4c}.btn.green{background:#14924c}.input,.select{width:100%;border:1px solid #dce1e9;border-radius:13px;padding:12px;background:#fff;margin:5px 0 9px}label{display:block;font-size:12px;font-weight:700;color:#687386;margin-top:4px}.person,.task{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #edf0f3}.person:last-child,.task:last-child{border:0}.avatar{width:43px;height:43px;border-radius:14px;background:#e9edff;color:#3152bf;display:grid;place-items:center;font-weight:800}.pill{font-size:12px;font-weight:750;padding:6px 9px;border-radius:10px;background:#eaf8ef;color:#197447;white-space:nowrap}.pill.gray{background:#eef1f5;color:#687386}.pill.red{background:#fff0f1;color:#c42e3f}.pill.yellow{background:#fff7dc;color:#8c6500}.small{font-size:12px;color:#788294}.kpirow{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr;gap:6px;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f3;font-size:13px}.kpirow b{font-size:14px}.up{color:#15904a;font-weight:750}.down{color:#d73c4b;font-weight:750}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;height:78px;background:#fff;border-top:1px solid #e4e8ef;display:flex;justify-content:space-around;padding-top:8px;z-index:10}.nav button{border:0;background:none;color:#7b8492;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button.active{color:#2458e8;font-weight:800}.ico{font-size:21px}.empty{text-align:center;padding:22px;color:#778194}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}.modal.open{display:flex}.actions{display:flex;gap:8px}.actions>*{flex:1}.notice{background:#eef5ff;border:1px solid #d6e5ff;border-radius:15px;padding:12px;color:#254a9d}.danger{background:#fff1f2;border:1px solid #ffd8dc}.ok{background:#edf9f2;border:1px solid #d1f0dd}.kpi-card{background:#f7f8fb;border-radius:16px;padding:14px;margin-top:10px}.kpi-big{font-size:26px;font-weight:850}.pending{color:#9a6a00;font-weight:800}.missing{color:#c42e3f;font-weight:800}.done{color:#197447;font-weight:800}.invite{font-size:12px;margin-top:5px}.invite.ok{color:#197447}.invite.pending{color:#9a6a00}.invite.err{color:#c42e3f}

.auth-gate{position:fixed;inset:0;background:#f4f6fa;z-index:100;display:grid;place-items:center;padding:22px}.auth-card{width:min(100%,420px);background:#fff;border-radius:26px;padding:24px;box-shadow:0 10px 40px #17203318}.auth-brand{font-size:12px;font-weight:800;letter-spacing:.08em;color:#687386}.auth-title{font-size:28px;font-weight:850;margin:6px 0 5px}.auth-sub{color:#687386;font-size:14px;line-height:1.45;margin-bottom:20px}.auth-error{display:none;background:#fff0f1;border:1px solid #ffd8dc;color:#b52d3c;border-radius:13px;padding:11px;font-size:13px;margin-bottom:12px}.auth-loading{display:none;color:#687386;font-size:13px;margin-top:10px}.logout-btn{position:absolute;right:14px;top:14px;border:0;background:#263248;color:#fff;border-radius:10px;padding:8px 10px;font-weight:750;font-size:12px}
</style>

    <div class="auth-sub">Imposta la password scelta da te per accedere a Store Manager.</div>

  </div>
</div>
<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-brand">STORE MANAGER</div>
    <div class="auth-title">Accesso</div>
    <div class="auth-sub">Accedi con il tuo account per entrare nel gestionale.</div>

</div>
<div class="app">
<header class="head" style="position:relative"><button class="logout-btn" onclick="logout()">Esci</button><div class="eyebrow">STORE MANAGER</div><div class="title">Gestione Personale</div><div class="sub">Planning · Attività · KPI · Richieste</div></header>
<main id="main"></main><nav id="nav" class="nav"></nav>
</div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const SUPABASE_URL="https://mgklvroxfowgqljehquz.supabase.co";
const SUPABASE_KEY="sb_publishable_Jro2VCtNW_GFYE6w0hfUYw_SBNsvb8M";
const KEY="store_manager_v5";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{tab:"home",people:[],requests:[],tasks:[],shifts:[],kpi:{selected:"2026-09",storeByPeriod:{},peopleByPeriod:{},daily:{},history:{}},online:true};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10);
function periodLabel(p){const[y,m]=p.split("-").map(Number);return new Intl.DateTimeFormat("it-IT",{month:"long",year:"numeric"}).format(new Date(y,m-1,1)).replace(/^./,c=>c.toUpperCase())}
function previousPeriod(p){const[y,m]=p.split("-").map(Number);return `${y-1}-${String(m).padStart(2,"0")}`}
function monthOptions(){return ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"].map((n,i)=>`<option value="${String(i+1).padStart(2,"0")}">${n}</option>`).join("")}
function yearOptions(selected){let y=+selected.slice(0,4),s="";for(let i=2020;i<=2035;i++)s+=`<option value="${i}" ${i===y?"selected":""}>${i}</option>`;return s}
function ensureKpi(p){if(!S.kpi.storeByPeriod[p])S.kpi.storeByPeriod[p]={sales:0,receipts:0,avg:0,upt:0,conv:0};S.people.forEach(x=>{if(!S.kpi.peopleByPeriod[x.id])S.kpi.peopleByPeriod[x.id]={}})}
function dateLocal(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function kpiPeriodFromDate(d){return d.slice(0,7)}
function weekNumber(d){let x=new Date(d+"T12:00:00"),day=x.getDay()||7;x.setDate(x.getDate()+4-day);let y=new Date(x.getFullYear(),0,1);return Math.ceil((((x-y)/86400000)+1)/7)}
function sameWeekLastYear(d){let x=new Date(d+"T12:00:00");x.setFullYear(x.getFullYear()-1);return dateLocal(x)}
function kpiRowsForPerson(pid,period){let rows=Object.values(S.kpi.daily||{}).filter(r=>String(r.personId)===String(pid)&&r.date.startsWith(period));return rows.sort((a,b)=>a.date.localeCompare(b.date))}
function calcKpi(rows){let sales=rows.reduce((a,r)=>a+(+r.sales||0),0),receipts=rows.reduce((a,r)=>a+(+r.receipts||0),0),pieces=rows.reduce((a,r)=>a+(+r.pieces||0),0);return {sales,receipts,pieces,atv:receipts?sales/receipts:0,upt:receipts?pieces/receipts:0}}
function todayKpiRows(){return S.kpi.daily||{}}
function kpiCutoffMissing(){let now=new Date(),d=dateLocal(now),h=now.getHours();return h>=22 && S.people.filter(p=>p.active).filter(p=>!Object.values(todayKpiRows()).some(r=>String(r.personId)===String(p.id)&&r.date===d)).map(p=>p)}
function openModal(title,body){document.getElementById("sheet").innerHTML=`<div class="row"><h2 style="margin:0 0 15px">${title}</h2><button class="btn gray" onclick="closeModal()">Chiudi</button></div>${body}`;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function isManager(){return PROFILE?.ruolo==="manager"} function myPerson(){return S.people.find(p=>String(p.id)===String(PROFILE?.dipendente_id))||null} function allowedTab(t){return isManager()||["home","planning","tasks","requests","kpi"].includes(t)} function nav(){let a=isManager()?[ ["home","⌂","Home"],["planning","▦","Planning"],["people","♙","Personale"],["tasks","✓","Attività"],["requests","✉","Richieste"],["kpi","▥","KPI"] ]:[ ["home","⌂","Home"],["planning","▦","I miei turni"],["tasks","✓","Le mie attività"],["requests","✉","Le mie richieste"],["kpi","▥","Il mio KPI"] ];document.getElementById("nav").innerHTML=a.map(x=>`<button class="${S.tab==x[0]?"active":""}" onclick="S.tab='${x[0]}';save();render()"><span class="ico">${x[1]}</span>${x[2]}</button>`).join("")}
let AUTH=null;
let PROFILE=null;
const authHeaders=()=>({apikey:SUPABASE_KEY,Authorization:"Bearer "+(AUTH?.access_token||SUPABASE_KEY),"Content-Type":"application/json"});
async function sb(path,opt={}){const headers={...authHeaders(),Prefer:opt.prefer||"return=representation",...(opt.headers||{})};const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers});if(!r.ok){let t=await r.text();throw new Error(t||r.status)}return r.status===204?null:r.json()}
async function authToken(email,password){const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error_description||data.msg||data.message||"Email o password non corretti.");return data}
async function fetchProfile(){if(!AUTH?.user?.id)return null;const rows=await sb("profili?id=eq."+encodeURIComponent(AUTH.user.id)+"&select=ruolo,dipendente_id");return rows?.[0]||null}
function showAuthError(msg){const e=document.getElementById("authError");e.textContent=msg;e.style.display="block"}
function setAuthLoading(v){document.getElementById("authLoading").style.display=v?"block":"none";document.getElementById("authLogin").disabled=v}
async function login(){const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;if(!email||!password){showAuthError("Inserisci email e password.");return}document.getElementById("authError").style.display="none";setAuthLoading(true);try{AUTH=await authToken(email,password);localStorage.setItem("sm_auth",JSON.stringify(AUTH));PROFILE=await fetchProfile();if(!PROFILE)throw new Error("Account creato, ma non è ancora associato a un ruolo Store Manager.");document.getElementById("authGate").style.display="none";bootApp()}catch(e){AUTH=null;PROFILE=null;localStorage.removeItem("sm_auth");showAuthError(e.message||"Accesso non riuscito.")}finally{setAuthLoading(false)}}
async function logout(){try{if(AUTH?.access_token)await fetch(SUPABASE_URL+"/auth/v1/logout",{method:"POST",headers:authHeaders()})}catch{}AUTH=null;PROFILE=null;localStorage.removeItem("sm_auth");document.getElementById("authGate").style.display="grid";document.getElementById("authPassword").value=""}
async function restoreAuth(){const raw=localStorage.getItem("sm_auth");if(!raw)return false;try{AUTH=JSON.parse(raw);const r=await fetch(SUPABASE_URL+"/auth/v1/user",{headers:authHeaders()});if(!r.ok)throw new Error("sessione scaduta");AUTH.user=await r.json();localStorage.setItem("sm_auth",JSON.stringify(AUTH));PROFILE=await fetchProfile();return !!PROFILE}catch{localStorage.removeItem("sm_auth");AUTH=null;PROFILE=null;return false}}
function bootApp(){render();loadRequests();loadKpis();loadHistory()}
function showInviteError(msg){const e=document.getElementById("inviteError");e.textContent=msg;e.style.display="block"}
function setInviteLoading(v){document.getElementById("inviteLoading").style.display=v?"block":"none";document.getElementById("inviteSave").disabled=v}
function inviteTokens(){let h=(location.hash||"").replace(/^#/,""),q=new URLSearchParams(h);return {access_token:q.get("access_token"),refresh_token:q.get("refresh_token"),type:q.get("type")}}
async function completeInvite(){
  const p=document.getElementById("invitePassword").value;
  const p2=document.getElementById("invitePassword2").value;
  if(!p||p.length<6)return showInviteError("La password deve contenere almeno 6 caratteri.");
  if(p!==p2)return showInviteError("Le password non coincidono.");
  const tok=inviteTokens();
  if(!tok.access_token)return showInviteError("Il link di invito non è più valido. Chiedi al Manager di reinviare l'invito.");
  setInviteLoading(true);document.getElementById("inviteError").style.display="none";
  try{
    const ur=await fetch(SUPABASE_URL+"/auth/v1/user",{
      method:"PUT",
      headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+tok.access_token,"Content-Type":"application/json"},
      body:JSON.stringify({password:p})
    });
    let ud={};try{ud=await ur.json()}catch{}
    if(!ur.ok)throw new Error(ud.msg||ud.message||"Non è stato possibile impostare la password.");
    AUTH={access_token:tok.access_token,refresh_token:tok.refresh_token,user:ud};
    localStorage.setItem("sm_auth",JSON.stringify(AUTH));
    try{
      await fetch(SUPABASE_URL+"/rest/v1/profili",{
        method:"POST",
        headers:{...authHeaders(),Prefer:"return=minimal"},
        body:JSON.stringify({id:ud.id,ruolo:"ragazzo",dipendente_id:ud.user_metadata?.dipendente_id??null})
      });
    }catch(e){}
    history.replaceState(null,"",location.pathname+location.search);
    document.getElementById("inviteGate").style.display="none";
    PROFILE=await fetchProfile();
    if(!PROFILE)PROFILE={ruolo:"ragazzo",dipendente_id:ud.user_metadata?.dipendente_id??null};
    bootApp();
    alert("Password impostata correttamente. Benvenuto in Store Manager.");
  }catch(e){showInviteError(e.message||"Errore durante l'attivazione dell'account.");}
  finally{setInviteLoading(false)}
}
async function bootAuth(){
  const tok=inviteTokens();
  if(tok.access_token && (tok.type==="invite" || tok.type==="recovery")){
    document.getElementById("authGate").style.display="none";
    document.getElementById("inviteGate").style.display="grid";
    return;
  }
  document.getElementById("authGate").style.display="grid";
  if(await restoreAuth()){document.getElementById("authGate").style.display="none";bootApp()}
}
async function loadRequests(){try{let rows=await sb("Richieste?select=*&order=created_at.desc");let all=rows.map(r=>({id:r.id,personId:r.dipendente_id,type:r.tipo,start:r.data_richiesta,end:r.data_richiesta_fine,note:r.note,status:r.stato,created:r.created_at}));S.requests=isManager()?all:all.filter(r=>String(r.personId)===String(PROFILE?.dipendente_id));S.online=true;save();render()}catch(e){S.online=false;save();render()}}
async function loadKpis(){try{let rows=await sb('KpiGiornalieri?select=*&order=data.asc');S.kpi.daily={};rows.forEach(r=>{let key=String(r.dipendente_id)+'_'+r.data;S.kpi.daily[key]={id:r.id,personId:r.dipendente_id,date:r.data,sales:Number(r.fatturato)||0,receipts:Number(r.scontrini)||0,pieces:Number(r.pezzi_venduti)||0,updatedAt:r.created_at||null}});S.online=true;save();render()}catch(e){console.warn('KPI online non caricati',e);S.online=false;save();render()}}
async function saveDailyKpi(){let pid=+document.getElementById('kePerson').value,date=document.getElementById('keDate').value;if(!isManager()){let me=myPerson();if(!me)return alert('Il tuo account non è ancora collegato a una risorsa.');if(String(pid)!==String(me.id))return alert('Puoi inserire KPI solo per te.');}if(!pid||!date)return alert('Seleziona risorsa e data.');let sales=+document.getElementById('keSales').value||0,receipts=+document.getElementById('keReceipts').value||0,pieces=+document.getElementById('kePieces').value||0;let payload={dipendente_id:pid,data:date,fatturato:sales,scontrini:receipts,pezzi_venduti:pieces};try{let rows=await sb('KpiGiornalieri?on_conflict=dipendente_id,data',{method:'POST',prefer:'resolution=merge-duplicates,return=representation',body:JSON.stringify(payload)});let r=Array.isArray(rows)?rows[0]:rows;let key=pid+'_'+date;S.kpi.daily[key]={id:r?.id||key,personId:pid,date,sales,receipts,pieces,updatedAt:new Date().toISOString()};save();closeModal();await loadKpis()}catch(e){alert('Supabase non ha accettato il KPI.\n\n'+(e.message||e))}}
async function deleteDailyKpi(key){let r=S.kpi.daily?.[key];if(!r)return;if(!isManager()&&String(r.personId)!==String(PROFILE?.dipendente_id))return alert('Puoi eliminare solo i tuoi KPI.');if(!confirm(`Eliminare i KPI del ${r.date}?`))return;try{if(r.id&&String(r.id)!==key)await sb('KpiGiornalieri?id=eq.'+encodeURIComponent(r.id),{method:'DELETE',prefer:'return=minimal'});delete S.kpi.daily[key];save();await loadKpis()}catch(e){alert('Impossibile eliminare il KPI.\n\n'+(e.message||e))}}
function editDailyKpi(pid,date){if(!isManager()&&String(pid)!==String(PROFILE?.dipendente_id))return alert('Puoi modificare solo i tuoi KPI.');kpiEntry(pid,date)}
async function createRequest(id){let p=S.people.find(x=>x.id===id);if(!isManager()){let me=myPerson();if(!me)return alert('Il tuo account non è ancora collegato a una risorsa.');p=me;}if(!p){alert('Seleziona una risorsa.');return}if(!isManager()&&String(p.id)!==String(PROFILE?.dipendente_id))return alert('Puoi creare richieste solo per te.');let start=document.getElementById('rqStart').value,end=document.getElementById('rqEnd').value,note=document.getElementById('rqNote').value.trim();if(!start){alert('Inserisci la data.');return}if(!end)end=start;try{await sb('Richieste',{method:'POST',body:JSON.stringify({dipendente_id:p.id,tipo:'Giorno libero',data_richiesta:start,data_richiesta_fine:end,note,stato:'In attesa'})});closeModal();await loadRequests();alert('Richiesta inviata.')}catch(e){alert('Supabase non ha accettato la richiesta.\n\n'+(e.message||e))}}
async function updateRequest(id,status){if(!isManager())return alert('Solo il Manager può approvare o rifiutare le richieste.');try{await sb('Richieste?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({stato:status})});await loadRequests()}catch(e){alert('Impossibile aggiornare la richiesta.\n\n'+(e.message||e))}}
function requestForm(){let a=S.people.filter(p=>p.active);if(!isManager()){let me=myPerson();if(!me)return alert('Il tuo account non è ancora collegato a una risorsa.');a=[me]}openModal('Nuova richiesta giorno libero',`<label>Risorsa</label><select id="rqPerson" class="select" ${!isManager()?'disabled':''}>${a.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><label>Dal</label><input id="rqStart" class="input" type="date" value="${today()}"><label>Al</label><input id="rqEnd" class="input" type="date" value="${today()}"><label>Nota / motivazione</label><textarea id="rqNote" class="input" rows="3" placeholder="Facoltativa"></textarea><button class="btn" style="width:100%" onclick="createRequest(+document.getElementById('rqPerson').value)">Invia richiesta</button>`)}
function requests(){if(!isManager()){let mine=S.requests.filter(r=>String(r.personId)===String(PROFILE?.dipendente_id));return `<div class="row"><div class="section">Le mie richieste</div><button class="btn" onclick="requestForm()">+ Richiesta</button></div><section class="card"><div class="notice"><b>Le tue richieste</b><div class="small">Puoi creare e consultare solo le tue richieste. L'approvazione è gestita dal Manager.</div></div></section><section class="card">${mine.length?mine.map(r=>`<div style="padding:13px 0;border-bottom:1px solid #edf0f3"><div class="row"><div><b>${r.start}${r.end&&r.end!==r.start?' → '+r.end:''}</b><div class="small">${esc(r.type||'Giorno libero')}</div></div><span class="pill ${r.status==='Approvata'?'':r.status==='Rifiutata'?'red':'yellow'}">${esc(r.status)}</span></div>${r.note?`<div class="small" style="margin:8px 0">Nota: ${esc(r.note)}</div>`:''}</div>`).join(''):`<div class="empty">Non hai ancora inviato richieste.</div>`}</section>`}let p=S.requests.filter(r=>r.status==='In attesa').length;return `<div class="row"><div class="section">Richieste giorni liberi</div><button class="btn" onclick="requestForm()">+ Richiesta</button></div><section class="card"><div class="notice"><b>${p} ${p===1?'richiesta':'richieste'} in sospeso</b><div class="small">Le richieste vengono salvate online in Supabase.</div></div></section><section class="card">${S.requests.length?S.requests.map(r=>{let person=S.people.find(p=>p.id==r.personId);return `<div style="padding:13px 0;border-bottom:1px solid #edf0f3"><div class="row"><div><b>${esc(person?.name||'Risorsa')}</b><div class="small">${r.start}${r.end&&r.end!==r.start?' → '+r.end:''} · ${esc(r.type||'Giorno libero')}</div></div><span class="pill ${r.status==='Approvata'?'':r.status==='Rifiutata'?'red':'yellow'}">${esc(r.status)}</span></div>${r.note?`<div class="small" style="margin:8px 0">Motivazione: ${esc(r.note)}</div>`:''}${r.status==='In attesa'?`<div class="actions" style="margin-top:8px"><button class="btn green" onclick="updateRequest(${r.id},'Approvata')">Approva</button><button class="btn red" onclick="updateRequest(${r.id},'Rifiutata')">Rifiuta</button></div>`:''}</div>`}).join(''):`<div class="empty">Nessuna richiesta.</div>`}</section>`}
async function loadHistory(){try{let rows=await sb('KpiStorico?select=*&order=anno.asc,settimana.asc');S.kpi.history={};rows.forEach(r=>{S.kpi.history[String(r.anno)+'_'+String(r.settimana)]={id:r.id,year:+r.anno,week:+r.settimana,sales:+r.fatturato||0,receipts:+r.scontrini||0,pieces:+r.pezzi_venduti||0}});save();render()}catch(e){console.warn('Storico KPI non caricato',e)}}
function histKey(y,w){return String(y)+'_'+String(w)}
function historyRow(y,w){return S.kpi.history?.[histKey(y,w)]||null}
function historyEntry(y,w){if(!isManager())return alert("Solo il Manager può inserire o modificare lo storico.");let r=historyRow(y,w);openModal(r?'Modifica storico KPI':'Inserisci storico KPI',`<div class="notice">Dati storici del negozio. Questi valori servono per il confronto con la stessa settimana dell'anno successivo.</div><label>Anno</label><input id="hy" class="input" type="number" min="2020" max="2100" value="${y}"><label>Settimana</label><input id="hw" class="input" type="number" min="1" max="53" value="${w}"><label>Fatturato</label><input id="hs" class="input" type="number" step="0.01" value="${r?.sales??''}"><label>Scontrini</label><input id="hr" class="input" type="number" min="0" step="1" value="${r?.receipts??''}"><label>Pezzi venduti</label><input id="hp" class="input" type="number" min="0" step="1" value="${r?.pieces??''}"><button class="btn" style="width:100%" onclick="saveHistory()">${r?'Salva modifiche':'Salva storico'}</button>${r?`<button class="btn red" style="width:100%;margin-top:8px" onclick="deleteHistory(${r.id});closeModal()">Elimina settimana</button>`:''}`)}
async function saveHistory(){if(!isManager())return alert("Solo il Manager può modificare lo storico.");let year=+document.getElementById('hy').value,week=+document.getElementById('hw').value,sales=+document.getElementById('hs').value||0,receipts=+document.getElementById('hr').value||0,pieces=+document.getElementById('hp').value||0;if(!year||week<1||week>53)return alert('Anno o settimana non validi.');let payload={anno:year,settimana:week,fatturato:sales,scontrini:receipts,pezzi_venduti:pieces};try{let rows=await sb('KpiStorico?on_conflict=anno,settimana',{method:'POST',prefer:'resolution=merge-duplicates,return=representation',body:JSON.stringify(payload)});let r=Array.isArray(rows)?rows[0]:rows;S.kpi.history=S.kpi.history||{};S.kpi.history[histKey(year,week)]={id:r?.id||histKey(year,week),year,week,sales,receipts,pieces};save();closeModal();await loadHistory()}catch(e){alert('Supabase non ha accettato lo storico KPI.\n\n'+(e.message||e))}}
async function deleteHistory(id){if(!isManager())return alert("Solo il Manager può eliminare lo storico.");if(!confirm('Eliminare questo dato storico?'))return;try{await sb('KpiStorico?id=eq.'+encodeURIComponent(id),{method:'DELETE',prefer:'return=minimal'});await loadHistory()}catch(e){alert('Impossibile eliminare lo storico.\n\n'+(e.message||e))}}
function historyCard(year,week){let r=historyRow(year,week);let c=r?calcKpi([{sales:r.sales,receipts:r.receipts,pieces:r.pieces}]):{sales:0,receipts:0,pieces:0,atv:0,upt:0};return `<section class="card"><div class="row"><div><b>🔵 Storico settimana ${week} · ${year}</b><div class="small">Solo Manager · base di confronto</div></div><button class="btn gray" onclick="historyEntry(${year},${week})">${r?'Modifica':'Inserisci'}</button></div>${r?`<div class="grid" style="margin-top:10px"><div class="metric"><span>Fatturato</span><b>${fmt(c.sales)}</b></div><div class="metric"><span>ATV</span><b>${fmt(c.atv)}</b></div><div class="metric"><span>UPT</span><b>${c.upt.toFixed(2)}</b></div></div>`:`<div class="empty">Nessun dato storico inserito per questa settimana.</div>`}</section>`}
function kpi(){
 let period=S.kpi.selected||dateLocal().slice(0,7), today=dateLocal();
 if(!isManager()){let me=myPerson();let rows=me?kpiRowsForPerson(me.id,period):[],c=calcKpi(rows);return `<div class="row"><div class="section">Il mio KPI</div><button class="btn" onclick="kpiEntry(${me?.id||''})">+ Inserisci dati</button></div><section class="card notice"><b>👤 I miei KPI · ${periodLabel(period)}</b><div class="small">Visualizzi e modifichi esclusivamente i tuoi dati giornalieri.</div></section><section class="card"><div class="grid"><div class="metric"><span>Fatturato</span><b>${fmt(c.sales)}</b></div><div class="metric"><span>ATV</span><b>${fmt(c.atv)}</b></div><div class="metric"><span>UPT</span><b>${c.upt.toFixed(2)}</b></div></div></section><section class="card"><b>Giornate inserite</b>${rows.length?rows.map(r=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #edf0f3"><div><b>${r.date}</b><div class="small">${fmt(r.sales)} · ${r.receipts} scontrini · ${r.pieces} pezzi</div></div><div class="actions"><button class="btn gray" onclick="editDailyKpi(${me.id},'${r.date}')">Modifica</button><button class="btn red" onclick="deleteDailyKpi('${String(me.id)}_${r.date}')">Elimina</button></div></div>`).join(''):`<div class="empty">Nessun dato inserito per questo mese.</div>`}</section>`}
 let active=S.people.filter(p=>p.active), todayRows=active.map(p=>({p,row:Object.values(todayKpiRows()).find(r=>String(r.personId)===String(p.id)&&r.date===today)})), missing=kpiCutoffMissing();
 let store=calcKpi(Object.values(todayKpiRows()).filter(r=>r.date.startsWith(period)));
 let selectedDate=today.startsWith(period)?today:period+'-01',wn=weekNumber(selectedDate),year=+period.slice(0,4),weekRows=Object.values(todayKpiRows()).filter(r=>weekNumber(r.date)===wn&&+r.date.slice(0,4)===year),wk=calcKpi(weekRows),hist=historyRow(year-1,wn),ly=hist?calcKpi([{sales:hist.sales,receipts:hist.receipts,pieces:hist.pieces}]):{sales:0,receipts:0,pieces:0,atv:0,upt:0},pct=(a,b)=>b?((a-b)/b*100):null;
 return `<div class="row"><div class="section">KPI</div><button class="btn" onclick="kpiEntry()">+ Inserisci dati</button></div><section class="card notice"><b>☁️ KPI condivisi online</b><div class="small">Il Manager vede tutti i dati. Ogni risorsa inserisce e modifica solo i propri KPI.</div></section><section class="card"><div class="grid"><div><label>Mese</label><select id="kpiMonth" class="select" onchange="changeKpiPeriod()">${monthOptions()}</select></div><div><label>Anno</label><select id="kpiYear" class="select" onchange="changeKpiPeriod()">${yearOptions(period)}</select></div></div></section>${missing.length?`<section class="card danger"><b>⚠️ KPI non inseriti entro le 22:00</b><div class="small" style="margin-top:6px">${missing.map(p=>esc(p.name)).join(' · ')}</div></section>`:''}<section class="card"><b>🏪 KPI negozio · settimana ${wn}</b><div class="small" style="margin:5px 0 12px">Settimana ${wn} ${year} vs settimana ${wn} ${year-1}</div><div class="grid"><div class="kpi-card"><span>Fatturato</span><div class="kpi-big">${fmt(wk.sales)}</div><div class="small">${fmt(ly.sales)} anno prec. ${pct(wk.sales,ly.sales)==null?'':`· ${pct(wk.sales,ly.sales)>=0?'+':''}${pct(wk.sales,ly.sales).toFixed(1)}%`}</div></div><div class="kpi-card"><span>ATV</span><div class="kpi-big">${fmt(wk.atv)}</div><div class="small">${fmt(ly.atv)} anno prec. ${pct(wk.atv,ly.atv)==null?'':`· ${pct(wk.atv,ly.atv)>=0?'+':''}${pct(wk.atv,ly.atv).toFixed(1)}%`}</div></div><div class="kpi-card"><span>UPT</span><div class="kpi-big">${wk.upt.toFixed(2)}</div><div class="small">${ly.upt.toFixed(2)} anno prec. ${pct(wk.upt,ly.upt)==null?'':`· ${pct(wk.upt,ly.upt)>=0?'+':''}${pct(wk.upt,ly.upt).toFixed(1)}%`}</div></div></div></section><section class="card"><div class="row"><div><b>🔵 Storico anno precedente</b><div class="small">Solo Manager: dati storici della settimana ${wn} ${year-1}.</div></div><button class="btn gray" onclick="historyEntry(${year-1},${wn})">${hist?'Modifica':'Inserisci'}</button></div>${hist?`<div class="grid" style="margin-top:10px"><div class="metric"><span>Fatturato ${year-1}</span><b>${fmt(ly.sales)}</b></div><div class="metric"><span>ATV ${year-1}</span><b>${fmt(ly.atv)}</b></div><div class="metric"><span>UPT ${year-1}</span><b>${ly.upt.toFixed(2)}</b></div></div>`:`<div class="small" style="margin-top:10px">Nessun dato storico inserito per questa settimana.</div>`}</section><section class="card"><b>👥 KPI personali · ${periodLabel(period)}</b>${active.map(p=>{let rows=kpiRowsForPerson(p.id,period),c=calcKpi(rows);return `<div class="kpi-card"><div class="row"><b>${esc(p.name)}</b><span class="pill ${rows.length?'':'gray'}">${rows.length?`${rows.length} giorni`:'Nessun dato'}</span></div><div class="grid" style="margin-top:8px"><div><span class="small">Fatturato</span><div><b>${fmt(c.sales)}</b></div></div><div><span class="small">ATV</span><div><b>${fmt(c.atv)}</b></div></div><div><span class="small">UPT</span><div><b>${c.upt.toFixed(2)}</b></div></div></div>${rows.length?`<div style="margin-top:10px">${rows.map(r=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #edf0f3"><span class="small">${r.date}</span><span class="small">${fmt(r.sales)} · ${r.receipts} scontrini · ${r.pieces} pezzi</span><button class="btn gray" onclick="editDailyKpi(${p.id},'${r.date}')">Modifica</button></div>`).join('')}</div>`:''}</div>`}).join('')||`<div class="empty">Nessuna risorsa attiva.</div>`}</section>`
}
function kpiEntry(pid,date){if(!isManager()){let me=myPerson();if(!me)return alert("Il tuo account non è ancora collegato a una risorsa.");pid=me.id;}let a=isManager()?S.people.filter(p=>p.active):[myPerson()].filter(Boolean),d=date||dateLocal(),r=pid?S.kpi.daily?.[String(pid)+'_'+d]:null;openModal(r?'Modifica KPI giornalieri':'Inserimento KPI giornalieri',`<div class="notice">Inserisci o correggi i dati della giornata. ATV e UPT vengono calcolati automaticamente.</div><label>Risorsa</label><select id="kePerson" class="select" ${!isManager()?'disabled':''}>${a.map(p=>`<option value="${p.id}" ${String(p.id)===String(pid||a[0]?.id)?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label>Data</label><input id="keDate" class="input" type="date" value="${d}" ${pid?'disabled':''}><label>Fatturato</label><input id="keSales" class="input" type="number" step="0.01" value="${r?.sales??''}" placeholder="0,00"><label>Scontrini</label><input id="keReceipts" class="input" type="number" min="0" step="1" value="${r?.receipts??''}" placeholder="0"><label>Pezzi venduti</label><input id="kePieces" class="input" type="number" min="0" step="1" value="${r?.pieces??''}" placeholder="0"><button class="btn" style="width:100%" onclick="saveDailyKpi()">${r?'Salva modifiche':'Salva KPI'}</button>${r?`<button class="btn red" style="width:100%;margin-top:8px" onclick="deleteDailyKpi('${String(pid)}_${d}');closeModal()">Elimina giornata</button>`:''}`)}

function changeKpiPeriod(){S.kpi.selected=document.getElementById("kpiYear").value+"-"+document.getElementById("kpiMonth").value;save();render()}
function render(){if(!allowedTab(S.tab))S.tab="home";let t=S.tab;document.getElementById("main").innerHTML=t==="home"?home():t==="planning"?planning():t==="people"?people():t==="tasks"?tasks():t==="requests"?requests():kpi();nav();if(t==="kpi"){let[y,m]=(S.kpi.selected||"2026-09").split("-");document.getElementById("kpiMonth").value=m;document.getElementById("kpiYear").value=y}}
bootAuth();
</script>
</body></html>
